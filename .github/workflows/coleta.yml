name: Coleta RH Sorocaba

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 5 * *"  # Dia 5 de cada mês às 09:00 UTC

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Executar coletor
        run: python coletor.py

      - name: Commitar dados atualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dados/
          git diff --staged --quiet || git commit -m "chore: atualização mensal automática"
          git push

